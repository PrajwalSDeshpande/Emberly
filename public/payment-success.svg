<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Payment successful" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.ring{stroke-dasharray:340;stroke-dashoffset:340;animation:draw 4s ease-out infinite}
.tick{stroke-dasharray:80;stroke-dashoffset:80;animation:tick 4s ease-out infinite}
.cf{transform-box:fill-box;transform-origin:center;animation:pop 4s ease-out infinite;opacity:0}
@keyframes draw{0%{stroke-dashoffset:340}30%,100%{stroke-dashoffset:0}}
@keyframes tick{0%,25%{stroke-dashoffset:80}45%,100%{stroke-dashoffset:0}}
@keyframes pop{0%,30%{transform:translate(0,0) scale(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(220deg) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ring,.tick{stroke-dashoffset:0}}
</style>
<circle cx="120" cy="120" r="70" fill="#2BD9A8" fill-opacity=".14"/>
<circle class="ring" cx="120" cy="120" r="54" fill="none" stroke="#2BD9A8" stroke-width="8" stroke-linecap="round" transform="rotate(-90 120 120)"/>
<path class="tick" d="M96 122l18 18 32-36" fill="none" stroke="#2BD9A8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="cf" x="116" y="116" width="10" height="10" rx="2" fill="#FF8A3D" style="--x:-85px;--y:-80px"/>
<rect class="cf" x="116" y="116" width="8" height="14" rx="2" fill="#8C6BFF" style="--x:90px;--y:-70px"/>
<circle class="cf" cx="120" cy="120" r="6" fill="#FFB238" style="--x:0px;--y:-100px"/>
<rect class="cf" x="116" y="116" width="10" height="10" rx="2" fill="#8C6BFF" style="--x:-95px;--y:30px"/>
<circle class="cf" cx="120" cy="120" r="5" fill="#FF8A3D" style="--x:95px;--y:40px"/>
<rect class="cf" x="116" y="116" width="8" height="12" rx="2" fill="#FFB238" style="--x:30px;--y:95px"/>
</svg>
