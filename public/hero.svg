<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="A glowing jar collecting sparks and supporter messages" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="halo"><stop offset="0" stop-color="#6D48FF" stop-opacity=".55"/><stop offset="1" stop-color="#6D48FF" stop-opacity="0"/></radialGradient>
<radialGradient id="core"><stop offset="0" stop-color="#FFE3A3"/><stop offset=".45" stop-color="#FF9A45"/><stop offset="1" stop-color="#FF6A2F" stop-opacity="0"/></radialGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
<linearGradient id="lid" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8C6BFF"/><stop offset="1" stop-color="#4B2BD6"/></linearGradient>
<clipPath id="jc"><rect x="200" y="230" width="240" height="300" rx="72"/></clipPath>
</defs>
<style>
.halo{transform-box:fill-box;transform-origin:center;animation:br 5s ease-in-out infinite}
.core{transform-box:fill-box;transform-origin:center;animation:br 3s ease-in-out infinite}
.spark{animation:rise 4.2s linear infinite;opacity:0}
.chip{animation:bob 5s ease-in-out infinite}
.t{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:19px;fill:#F4F2FF}
.a{font-weight:700;fill:#FFB238}
@keyframes br{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-190px);opacity:0}}
@keyframes bob{50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.spark{opacity:.8}}
</style>
<circle class="halo" cx="320" cy="350" r="290" fill="url(#halo)"/>
<g>
<rect x="200" y="230" width="240" height="300" rx="72" fill="url(#glass)" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
<g clip-path="url(#jc)">
<circle class="core" cx="320" cy="455" r="120" fill="url(#core)"/>
<circle cx="285" cy="470" r="9" fill="#FFD27A"/><circle cx="335" cy="440" r="7" fill="#FFE3A3"/><circle cx="360" cy="490" r="10" fill="#FFB238"/><circle cx="310" cy="505" r="6" fill="#FFE3A3"/>
</g>
<path d="M228 275q-8 85 0 165" stroke="#fff" stroke-opacity=".35" stroke-width="6" stroke-linecap="round" fill="none"/>
<rect x="226" y="190" width="188" height="50" rx="16" fill="url(#lid)"/>
<rect x="246" y="204" width="148" height="6" rx="3" fill="#fff" fill-opacity=".25"/>
</g>
<circle class="spark" cx="290" cy="180" r="5" fill="#FFB238" style="animation-delay:0s"/>
<circle class="spark" cx="330" cy="180" r="4" fill="#FFE3A3" style="animation-delay:-1.1s"/>
<circle class="spark" cx="355" cy="180" r="6" fill="#FF8A3D" style="animation-delay:-2.2s"/>
<circle class="spark" cx="312" cy="180" r="3" fill="#fff" style="animation-delay:-3.1s"/>
<g transform="translate(40 130)"><g class="chip"><rect width="230" height="56" rx="28" fill="#1A1740" stroke="#6D48FF" stroke-opacity=".7"/><circle cx="28" cy="28" r="14" fill="#2BD9A8"/><text class="t a" x="54" y="35">₹100</text><text class="t" x="110" y="35">keep going!</text></g></g>
<g transform="translate(370 330)"><g class="chip" style="animation-delay:-1.7s"><rect width="250" height="56" rx="28" fill="#1A1740" stroke="#FF8A3D" stroke-opacity=".7"/><circle cx="28" cy="28" r="14" fill="#8C6BFF"/><text class="t a" x="54" y="35">₹50</text><text class="t" x="102" y="35">loved the video</text></g></g>
<g transform="translate(50 470)"><g class="chip" style="animation-delay:-3.2s"><rect width="220" height="56" rx="28" fill="#1A1740" stroke="#2BD9A8" stroke-opacity=".7"/><circle cx="28" cy="28" r="14" fill="#FF8A3D"/><text class="t a" x="54" y="35">₹250</text><text class="t" x="118" y="35">thank you!</text></g></g>
</svg>
