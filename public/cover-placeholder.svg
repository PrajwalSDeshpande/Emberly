<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A1740"/><stop offset=".6" stop-color="#3B22B8"/><stop offset="1" stop-color="#6D48FF"/></linearGradient>
<pattern id="d" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" fill-opacity=".14"/></pattern>
<filter id="b"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
<style>.m{animation:dr 14s ease-in-out infinite alternate}.n{animation:dr 18s ease-in-out infinite alternate-reverse}@keyframes dr{to{transform:translate(120px,30px)}}@media (prefers-reduced-motion:reduce){.m,.n{animation:none}}</style>
<rect width="1200" height="320" fill="url(#bg)"/>
<g filter="url(#b)"><circle class="m" cx="250" cy="120" r="110" fill="#FF8A3D" fill-opacity=".7"/><circle class="n" cx="900" cy="220" r="130" fill="#2BD9A8" fill-opacity=".35"/></g>
<rect width="1200" height="320" fill="url(#d)"/>
</svg>
